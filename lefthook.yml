pre-commit:
  jobs:
    # --ignore-unknown so staging a file Prettier has no parser for (.editorconfig,
    # .prettierignore, fonts) skips it instead of failing the whole commit.
    #
    # CLAUDE.md is excluded because it is a symlink to AGENTS.md, and Prettier errors
    # on symlinks passed as explicit arguments. Listing it in .prettierignore does not
    # help; that only applies to directory traversal.
    - name: prettier
      run: npx prettier --write --ignore-unknown {staged_files}
      exclude:
        - CLAUDE.md
      stage_fixed: true
