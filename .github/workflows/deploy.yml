name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Don't let two deploys race. Queue rather than cancel: killing a run mid-deploy leaves
# you reasoning about where it landed, and queueing means pushes ship in order.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # Same gates as ci.yml. A push straight to main skips CI, so main has to
      # re-prove formatting, lint, and types before it ships to production.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          # account_id comes from wrangler.jsonc; only the token is secret.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
