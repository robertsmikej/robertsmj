name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

# CampWatch learned this the hard way: when only the deploy workflow runs checks,
# a green deploy can sit on top of unformatted or untyped code. Every gate that
# guards main runs here too, so a branch is provably clean before it merges.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage
