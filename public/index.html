<!doctype html>
<html lang="en">
<head>
  <script>
    /* No-flash theme init. Mirrors resolveTheme() in theme.js. */
    (function () {
      try {
        var s = localStorage.getItem('theme');
        var t = (s === 'dark' || s === 'light')
          ? s
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mike Roberts</title>
  <link rel="preload" href="/fonts/instrument-sans-v4-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/ibm-plex-mono-v20-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="scaffold-marker">robertsmj.com scaffold</main>
  <button data-theme-toggle type="button" aria-label="Toggle color theme">toggle</button>
  <script type="module" src="/main.js"></script>
</body>
</html>
